[theme]
base = "dark"
primaryColor = "#BB86FC"          # Mantém o roxo legal pros botões
backgroundColor = "#0f172a"       # Slate escuro suave (menos "preto morto", mais legível)
secondaryBackgroundColor = "#1e293b"  # Sidebar e cards um tom acima
textColor = "#cbd5e1"             # Cinza mais claro e contrastado (slate-300)
linkColor = "#8AB4F8"             # Links azuis suaves
font = "sans serif"
